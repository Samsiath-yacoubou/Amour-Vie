when@dev:
    web_profiler:
        # La barre flottante masquait le contenu des pages en prévisualisation.
        # Le profileur reste consultable sur /_profiler.
        toolbar: false

    framework:
        profiler:
            collect_serializer_data: true

when@test:
    framework:
        profiler:
            collect: false
            collect_serializer_data: true
